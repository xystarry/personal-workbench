name: 每日盘前分析

on:
  schedule:
    # 每个交易日（周一到周五）北京时间 08:50 = UTC 00:50
    - cron: '50 0 * * 1-5'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成盘前分析报告
        run: python3 scripts/morning_brief.py

      - name: 提交报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning-brief/
          git diff --quiet --cached || git commit -m "chore: 更新 $(TZ='Asia/Shanghai' date '+%Y-%m-%d') 盘前分析报告"
          git push

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: morning-brief
          publish_branch: gh-pages
          keep_files: true
          destination_dir: morning-brief
